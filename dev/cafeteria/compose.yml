# Solo desarrollo local con datos ficticios. Iniciar desde la raíz con:
# docker compose -p cafeteria-dev -f dev/cafeteria/compose.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo_dev
      POSTGRES_PASSWORD: cafeteria_dev_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo_dev -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db_data:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: odoo_dev
      PASSWORD: cafeteria_dev_local_only
    ports:
      - "127.0.0.1:18069:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - ../../addons:/mnt/extra-addons:ro

volumes:
  db_data:
  odoo_data:
