[options]
db_host = sass-data-base
db_port = 5432
db_user = odoo
db_password = odoo
addons_path = /mnt/extra-addons
admin_passwd = Admin123*
log_level = info
proxy_mode = True

; --- multitenancy: una base de datos por subdominio (pizzeria.dominio.co -> DB "pizzeria")
dbfilter = ^%d$
list_db = False

; --- rendimiento (2 restaurantes, 1 caja + varios meseros cada uno)
; workers > 0 habilita el puerto 8072 (websocket), necesario para sincronizar meseros/caja
workers = 2
max_cron_threads = 1
gevent_port = 8072
limit_memory_soft = 1342177280
limit_memory_hard = 1610612736
